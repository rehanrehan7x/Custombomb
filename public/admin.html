<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article Manager | ThumbGrab</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/"><img class="brand-logo" src="/logo.png" alt="ThumbGrab Logo"><span>ThumbGrab Admin</span></a><nav><a href="/articles.html">View Articles</a><a href="/">Website</a><button id="logout" class="nav-btn">Logout</button></nav></header><main class="wrap admin-main"><section class="admin-head"><div><span class="eyebrow">PRIVATE CMS</span><h1>Article Manager</h1><p class="muted">Create SEO-friendly YouTube articles with a title, description, cover photo, links and formatted content.</p></div></section><section class="admin-grid"><form id="articleForm" class="admin-form"><input type="hidden" id="editId"><label>Article title<input id="title" maxlength="180" required placeholder="Top 10 Indian YouTube Channels"></label><label>SEO description<textarea id="description" maxlength="320" required placeholder="A helpful overview of the top Indian YouTube channels..."></textarea></label><label>Cover photo URL<input id="image" type="url" placeholder="https://example.com/your-photo.jpg"><small class="muted">Use a public image URL. The image should be yours or licensed for your use.</small></label><label>URL slug<input id="slug" placeholder="top-10-indian-youtube-channels"></label><div class="editor-tools"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="formatBlock" data-value="h2">H2</button><button type="button" data-cmd="formatBlock" data-value="h3">H3</button><button type="button" data-cmd="insertUnorderedList">• List</button><button type="button" data-cmd="insertOrderedList">1. List</button><button type="button" id="linkBtn">Link</button></div><div id="editor" class="rich-editor" contenteditable="true" data-placeholder="Write your YouTube article here..."></div><button class="primary full" type="submit" id="saveBtn">Publish Article</button><button type="button" class="secondary full hidden" id="cancelEdit">Cancel Edit</button><div id="status" class="status"></div></form><aside class="article-list"><h2>Published Articles</h2><div id="articles"><p class="muted">Loading...</p></div></aside></section></main><script>
const $=id=>document.getElementById(id); let editing=null;
async function api(url,opt={}){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin.html';throw new Error('Unauthorized')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const list=await api('/api/admin/articles');$('articles').innerHTML=list.length?list.map(a=>`<div class="article-admin-item"><strong>${esc(a.title)}</strong><small>${new Date(a.publishedAt).toLocaleDateString()}</small><div><a href="/article/${encodeURIComponent(a.slug)}" target="_blank">View</a><button onclick="editArticle('${a._id}')">Edit</button><button onclick="deleteArticle('${a._id}')">Delete</button></div></div>`).join(''):'<p class="muted">No articles yet.</p>';window.articleCache=list}catch(e){$('articles').innerHTML='<p class="status">'+esc(e.message)+'</p>'}}
window.editArticle=id=>{const a=window.articleCache.find(x=>x._id===id);if(!a)return;editing=id;$('editId').value=id;$('title').value=a.title;$('description').value=a.description;$('image').value=a.image||'';$('slug').value=a.slug;$('editor').innerHTML=a.content;$('saveBtn').textContent='Update Article';$('cancelEdit').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};
window.deleteArticle=async id=>{if(!confirm('Delete this article permanently?'))return;try{await api('/api/admin/articles/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}};
document.querySelectorAll('.editor-tools button[data-cmd]').forEach(b=>b.addEventListener('click',()=>{document.execCommand(b.dataset.cmd,false,b.dataset.value||null);$('editor').focus()}));$('linkBtn').onclick=()=>{const u=prompt('Enter full URL (https://...)');if(u&&/^https?:\/\//i.test(u))document.execCommand('createLink',false,u)};
$('articleForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='Saving...';const payload={title:$('title').value,description:$('description').value,image:$('image').value,slug:$('slug').value,content:$('editor').innerHTML};try{if(editing)await api('/api/admin/articles/'+editing,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});else await api('/api/admin/articles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('status').textContent='Article saved successfully.';resetForm();await load()}catch(err){$('status').textContent=err.message}};
function resetForm(){$('articleForm').reset();$('editor').innerHTML='';editing=null;$('saveBtn').textContent='Publish Article';$('cancelEdit').classList.add('hidden')}$('cancelEdit').onclick=resetForm;$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.href='/admin.html'};load();
</script></body></html>
