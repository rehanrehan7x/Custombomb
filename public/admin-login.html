<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | ThumbGrab</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head><body><main class="admin-shell"><section class="admin-card"><img src="/logo.png" class="admin-logo" alt="ThumbGrab"><span class="eyebrow">PRIVATE ADMIN</span><h1>ThumbGrab Admin</h1><p class="muted">Sign in to create and manage YouTube articles.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary full" type="submit">Sign in</button><div id="loginStatus" class="status"></div></form><a class="text-link" href="/">← Back to ThumbGrab</a></section></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('loginStatus');s.textContent='Signing in...';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(r.ok) location.href='/admin.html'; else s.textContent=d.error||'Login failed.';});</script></body></html>
